[package]
name = "bevy-voxel-game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.1", features = [
    "dynamic_linking", 
    "bevy_dev_tools"
] }

bevy_rapier3d = { version = "0.30.0", features = ["simd-stable"] }
fastnoise-lite = "1.1.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
